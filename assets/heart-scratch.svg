<svg class="heart-scratch-svg" viewBox="0 0 400 400" aria-label="Scratch the heart">
        <defs>
          <clipPath id="heartClip">
            <path d="M200 370 C180 350 42 255 36 132 C31 64 83 28 136 40 C166 47 188 69 200 91 C212 69 234 47 264 40 C317 28 369 64 364 132 C358 255 220 350 200 370Z"/>
          </clipPath>
          <linearGradient id="heartMaroon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7d0b2b"/>
            <stop offset=".48" stop-color="#a30e36"/>
            <stop offset="1" stop-color="#65051f"/>
          </linearGradient>
          <radialGradient id="heartGlow" cx="50%" cy="35%" r="70%">
            <stop offset="0" stop-color="#c51b4d" stop-opacity=".34"/>
            <stop offset="1" stop-color="#5d061e" stop-opacity="0"/>
          </radialGradient>
          <mask id="scratchMask" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
            <rect x="0" y="0" width="400" height="400" fill="white"/>
            <g id="scratchMarks"></g>
          </mask>
        </defs>

        <foreignObject x="0" y="0" width="400" height="400" clip-path="url(#heartClip)">
          <div xmlns="http://www.w3.org/1999/xhtml" class="heart-reveal-fo"></div>
        </foreignObject>

        <path class="heart-cover" d="M200 370 C180 350 42 255 36 132 C31 64 83 28 136 40 C166 47 188 69 200 91 C212 69 234 47 264 40 C317 28 369 64 364 132 C358 255 220 350 200 370Z" fill="url(#heartMaroon)" mask="url(#scratchMask)"/>
        <path class="heart-glow" d="M200 370 C180 350 42 255 36 132 C31 64 83 28 136 40 C166 47 188 69 200 91 C212 69 234 47 264 40 C317 28 369 64 364 132 C358 255 220 350 200 370Z" fill="url(#heartGlow)" mask="url(#scratchMask)"/>

        <g class="heart-sparkles" clip-path="url(#heartClip)" mask="url(#scratchMask)">
          <circle cx="91" cy="111" r="2.1"/><circle cx="122" cy="176" r="1.6"/><circle cx="165" cy="125" r="1.4"/>
          <circle cx="290" cy="108" r="1.8"/><circle cx="319" cy="164" r="1.5"/><circle cx="268" cy="210" r="1.3"/>
          <circle cx="110" cy="252" r="1.4"/><circle cx="153" cy="286" r="1.7"/><circle cx="292" cy="274" r="1.6"/>
          <circle cx="245" cy="321" r="1.3"/><circle cx="83" cy="204" r="1.1"/><circle cx="337" cy="218" r="1.2"/>
          <text x="84" y="155">✦</text><text x="311" y="137">✦</text><text x="102" y="292">✦</text><text x="302" y="247">✦</text>
          <text x="224" y="150">✦</text><text x="176" y="250">✦</text>
        </g>

        <g class="heart-cover-text" clip-path="url(#heartClip)" mask="url(#scratchMask)">
          <text x="200" y="180" text-anchor="middle">SCRATCH TO REVEAL</text>
        </g>

        <path class="heart-outline" d="M200 370 C180 350 42 255 36 132 C31 64 83 28 136 40 C166 47 188 69 200 91 C212 69 234 47 264 40 C317 28 369 64 364 132 C358 255 220 350 200 370Z"/>
        <path id="heartErasePath" class="heart-erase" d="M200 370 C180 350 42 255 36 132 C31 64 83 28 136 40 C166 47 188 69 200 91 C212 69 234 47 264 40 C317 28 369 64 364 132 C358 255 220 350 200 370Z"/>
      </svg>